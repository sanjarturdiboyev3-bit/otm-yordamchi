<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — OTM Yordamchi</title>
<style>
  :root {
    --deep: #0B2A6B; --vivid: #1660FF; --line: #E4E9F2; --bg: #F5F7FB;
    --text: #16213E; --muted: #6B7690; --danger: #B23A3A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .gate-box {
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 32px; max-width: 360px; width: 100%; text-align: center;
  }
  .gate-box h1 { font-size: 18px; margin: 0 0 6px; color: var(--deep); }
  .gate-box p { font-size: 13px; color: var(--muted); margin: 0 0 20px; }
  .gate-box input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; margin-bottom: 12px;
  }
  .gate-box button {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    background: var(--vivid); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .gate-box button:disabled { opacity: .6; cursor: default; }
  .gate-error { color: var(--danger); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  .dash { display: none; max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  .dash h1 { font-size: 20px; color: var(--deep); margin: 0 0 4px; }
  .dash .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .tab {
    padding: 10px 16px; font-size: 13.5px; font-weight: 700; color: var(--muted);
    cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--vivid); border-bottom-color: var(--vivid); }
  .count-badge {
    display: inline-block; background: var(--line); color: var(--text);
    font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 4px;
  }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .card-meta { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .card-meta span { margin-right: 10px; }
  .card-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 40px 0; }
  .refresh-btn {
    font-size: 12.5px; color: var(--vivid); background: none; border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1>🔒 Admin kirish</h1>
    <p>Taklif va xato hisobotlarini ko'rish uchun parolni kiriting</p>
    <input type="password" id="pwInput" placeholder="Parol" autocomplete="current-password" />
    <button id="pwSubmit">Kirish</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div class="dash" id="dash">
  <h1>📋 Taklif va tavsiyalar</h1>
  <p class="sub">Foydalanuvchilardan kelgan xato hisobotlari va umumiy takliflar</p>
  <button class="refresh-btn" id="refreshBtn">🔄 Yangilash</button>
  <div class="tabs">
    <div class="tab active" data-tab="suggestions">💡 Takliflar <span class="count-badge" id="cSuggestions">0</span></div>
    <div class="tab" data-tab="reports">⚠️ Xato hisobotlari <span class="count-badge" id="cReports">0</span></div>
  </div>
  <div id="listSuggestions"></div>
  <div id="listReports" style="display:none;"></div>
</div>

<script>
  let password = '';

  function fmtDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso || ''; }
  }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderSuggestions(items) {
    const el = document.getElementById('listSuggestions');
    document.getElementById('cSuggestions').textContent = items.length;
    if (!items.length) { el.innerHTML = '<div class="empty">Hozircha takliflar yo\'q</div>'; return; }
    el.innerHTML = items.map(it => `
      <div class="card">
        <div class="card-meta">
          <span>🕐 ${esc(fmtDate(it.at))}</span>
          ${it.contact ? `<span>✉️ ${esc(it.contact)}</span>` : ''}
        </div>
        <div class="card-text">${esc(it.text)}</div>
      </div>
    `).join('');
  }

  function renderReports(items) {
    const el = document.getElementById('listReports');
    document.getElementById('cReports').textContent = items.length;
    if (!items.length) { el.innerHTML = '<div class="empty">Hozircha xato hisobotlari yo\'q</div>'; return; }
    el.innerHTML = items.map(it => `
      <div class="card">
        <div class="card-meta">
          <span>🕐 ${esc(fmtDate(it.at))}</span>
          <span>📄 ${esc(it.type)}</span>
          <span>📚 ${esc(it.fan)}</span>
          <span>📝 ${esc(it.mavzu)}</span>
          ${it.daraja ? `<span>🎓 ${esc(it.daraja)}</span>` : ''}
        </div>
        <div class="card-text">${esc(it.comment) || '(izohsiz)'}</div>
      </div>
    `).join('');
  }

  async function loadData() {
    const res = await fetch('/api/admin-feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    if (!res.ok) throw new Error('unauthorized');
    const data = await res.json();
    renderSuggestions(data.suggestions || []);
    renderReports(data.reports || []);
  }

  document.getElementById('pwSubmit').addEventListener('click', async () => {
    const btn = document.getElementById('pwSubmit');
    const errEl = document.getElementById('gateError');
    password = document.getElementById('pwInput').value;
    btn.disabled = true; btn.textContent = 'Tekshirilmoqda...';
    errEl.textContent = '';
    try {
      await loadData();
      document.getElementById('gate').style.display = 'none';
      document.getElementById('dash').style.display = 'block';
    } catch (e) {
      errEl.textContent = "Parol noto'g'ri yoki server xatosi.";
      btn.disabled = false; btn.textContent = 'Kirish';
    }
  });
  document.getElementById('pwInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('pwSubmit').click();
  });
  document.getElementById('refreshBtn').addEventListener('click', () => loadData().catch(() => {}));

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const which = tab.dataset.tab;
      document.getElementById('listSuggestions').style.display = which === 'suggestions' ? 'block' : 'none';
      document.getElementById('listReports').style.display = which === 'reports' ? 'block' : 'none';
    });
  });
</script>
</body>
</html>
