<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#F5F4F0; font-family:'Manrope',sans-serif; color:#2A2A2A; }

  .wrap { max-width:1000px; margin:0 auto; padding:24px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .logo { width:44px; height:44px; border-radius:50%; background:#16213E; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:20px; }
  h1 { font-size:24px; font-weight:700; color:#16213E; margin:0; font-family:'Source Serif 4',Georgia,serif; }
  .subtitle { font-size:14px; color:#6B7280; margin:2px 0 0; }
  .card { background:#fff; border:1px solid #E5E3DC; border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,0.03); }
  .form-card { padding:24px; margin-bottom:24px; }
  .form-grid { display:grid; grid-template-columns:1fr; gap:16px; }
  @media(min-width:700px){ .form-grid{ grid-template-columns:1fr 1fr 1fr; } }
  .search-toggle { display:flex; align-items:center; gap:8px; margin-top:18px; padding-top:16px; border-top:1px solid #E5E3DC; }
  .search-toggle input[type=checkbox] { width:16px; height:16px; accent-color:#16213E; cursor:pointer; flex-shrink:0; }
  .search-toggle label { font-size:13px; color:#2A2A2A; font-weight:600; margin:0; cursor:pointer; }
  .search-hint { font-size:11px; color:#6B7280; margin:4px 0 0 24px; }
  label { display:block; font-size:12px; font-weight:600; color:#6B7280; margin-bottom:4px; }
  input, select { width:100%; padding:9px 12px; border-radius:8px; border:1px solid #E5E3DC; font-family:inherit; font-size:14px; }
  .grid2 { display:grid; grid-template-columns:1fr; gap:20px; }
  @media(min-width:700px){ .grid2{ grid-template-columns:1fr 1fr; } }
  .item-card-head { padding:20px; display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .item-left { display:flex; gap:12px; align-items:center; }
  .icon-box { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
  .item-title { font-weight:700; font-size:15px; color:#16213E; margin:0; }
  .item-desc { font-size:12px; color:#6B7280; margin:2px 0 0; }
  .price-badge { background:#C9942A; color:#fff; font-size:12px; font-weight:700; padding:4px 12px; border-radius:999px; white-space:nowrap; }
  .item-body { padding:0 20px 20px; }
  button.generate { width:100%; padding:11px; border:none; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; background:#16213E; color:#fff; display:flex; align-items:center; justify-content:center; gap:8px; }
  button.generate:disabled { background:#E5E3DC; color:#6B7280; cursor:not-allowed; }
  .error-text { color:#B23A3A; font-size:12px; margin-top:8px; }
  .result-box { margin-top:16px; padding:14px 16px; border-radius:10px; background:#F9F8F5; border:1px solid #EDEBE3; font-size:13px; line-height:1.65; max-height:260px; overflow-y:auto; overflow-x:hidden; }

  .full-content { max-height:0; overflow:hidden; }
  .result-box h1, .result-box h2, .result-box h3, .full-content h1, .full-content h2, .full-content h3 { font-family:'Source Serif 4',Georgia,serif; color:#16213E; font-size:15px; margin:14px 0 6px; }
  .result-box h1:first-child, .result-box h2:first-child, .result-box h3:first-child, .result-box p:first-child, .full-content h1:first-child, .full-content h2:first-child, .full-content h3:first-child, .full-content p:first-child { margin-top:0; }
  .result-box p, .full-content p { margin:8px 0; }

  .result-box strong, .full-content strong { color:#16213E; }
  .result-box table, .full-content table { border-collapse:collapse; width:100%; margin:10px 0; font-size:12px; }
  .result-box th, .result-box td, .full-content th, .full-content td { border:1px solid #E5E3DC; padding:6px 8px; text-align:left; }
  .result-box th, .full-content th { background:#F0EFEA; }
  .result-box hr, .full-content hr { border:none; border-top:1px solid #E5E3DC; margin:14px 0; }
  .result-box .katex-display, .full-content .katex-display { margin:10px 0; overflow-x:auto; overflow-y:hidden; }
  .actions-row { display:flex; gap:8px; margin-top:10px; }
  .btn-download { flex:1; padding:9px; border-radius:8px; border:1px solid #E5E3DC; background:#fff; color:#16213E; font-weight:600; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-download:hover { background:#F5F4F0; }
  .btn-download:disabled { opacity:0.55; cursor:not-allowed; }
  .pay-gate { margin-top:16px; padding:14px; border-radius:10px; background:#FBF6EA; border:1px solid #EDE0BE; text-align:center; }
  .pay-gate-text { font-size:13px; color:#16213E; margin:0 0 10px; font-weight:600; line-height:1.4; }
  .btn-pay { width:100%; padding:11px; border:none; border-radius:8px; font-weight:700; font-size:14px; cursor:pointer; background:#C9942A; color:#fff; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-pay:hover { background:#B3831F; }
  .footer-total { text-align:center; margin-top:24px; font-size:14px; color:#6B7280; }

<body>
<div class="wrap">
  <header>
    <div class="logo">🎓</div>
    <div>
      <h1>O'qituvchi Yordamchisi</h1>
      <p class="subtitle">Bitta mavzu — to'rtta tayyor dars materiali, sun'iy intellekt yordamida</p>
    </div>
  </header>

  <div class="card form-card">
    <div class="form-grid">
      <div>
        <label>FAN</label>
        <input id="fan" value="Matematika" />
      </div>
      <div>
        <label>MAVZU</label>
        <input id="mavzu" placeholder="masalan: Matritsalar va amallar" />
      </div>
      <div>
        <label>DARAJA</label>
        <select id="daraja">
          <option>Maktab</option>
          <option>Kollej</option>
          <option selected>OTM (bakalavriat)</option>
        </select>
      </div>
    </div>
    <div class="search-toggle">
      <input type="checkbox" id="useSearch" />
      <label for="useSearch">🌐 Internetdan qo'shimcha/joriy ma'lumotlar bilan boyitish</label>
    </div>
    <p class="search-hint">Standart holatda o'chiq — tezroq va arzonroq. Joriy voqealar yoki statistik ma'lumot kerak bo'lgan mavzular uchun yoqing.</p>
  </div>

  <div class="grid2" id="cards"></div>

  <div class="footer-total" id="total" style="display:none;"></div>
</div>

function renderContent(el, text) {
  // Avval $$...$$ va $...$ ichidagi LaTeX formulalarni matndan ajratib olamiz,
  // bo'lmasa markdown parser "a_{11}" kabi ostki chiziqlarni kursiv belgisi
  // deb tushunib, formulani buzib qo'yadi.
  const mathStore = [];
  const protectedText = String(text)
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, expr) => {
      const i = mathStore.push({ expr, display: true }) - 1;
      return `@@MATH${i}@@`;
    })
    .replace(/\$([^$\n]+?)\$/g, (m, expr) => {
      const i = mathStore.push({ expr, display: false }) - 1;
      return `@@MATH${i}@@`;
    });

  let html = marked.parse(protectedText);

  html = html.replace(/@@MATH(\d+)@@/g, (m, i) => {
    const item = mathStore[Number(i)];
    if (!item) return m;
    try {
      return katex.renderToString(item.expr, { displayMode: item.display, throwOnError: false });
    } catch (e) {
      return item.expr;
    }
  });

  el.innerHTML = html;
}

async function downloadAsPDF(el, filename) {
  // Avvalgi usul (ekrandan -9999px surilgan nusxa) html2canvas'da ko'pincha
  // BO'SH sahifa hosil qilardi. Ishonchli usul: elementni o'z joyida vaqtincha
  // to'liq balandlikka kengaytirib suratga olamiz, so'ng qaytaramiz.
  const prevMaxHeight = el.style.maxHeight;
  const prevOverflow = el.style.overflow;
  el.style.maxHeight = 'none';
  el.style.overflow = 'visible';

  try {
    await html2pdf().from(el).set({
      margin: 10,
      filename: filename + '.pdf',
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    }).save();
  } finally {
    el.style.maxHeight = prevMaxHeight;
    el.style.overflow = prevOverflow;
  }
}

function downloadAsWord(el, filename) {
  const pre = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>" + filename + "</title></head><body style=\"font-family:Calibri,Arial,sans-serif;\">";
  const post = '</body></html>';
  const html = pre + el.innerHTML + post;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function downloadAsPPTX(slides, fan, mavzu, daraja, filename) {
  const NAVY = '16213E', GOLD = 'C9942A', CREAM = 'F9F8F5', DARK = '2A2A2A', LIGHTGOLD = 'EFDFC0';
  const accentIcons = ['lightbulb_FFFFFF', 'star_FFFFFF', 'bookmark_FFFFFF'];
  const pres = new PptxGenJS();
  pres.layout = 'LAYOUT_WIDE'; // 13.33 x 7.5"

  function iconBadge(slide, cx, cy, d, bgColor, iconKey) {
    slide.addShape(pres.ShapeType.ellipse, { x: cx, y: cy, w: d, h: d, fill: { color: bgColor }, line: { type: 'none' } });
    const iw = d * 0.52, off = (d - iw) / 2;
    slide.addImage({ data: ICONS_B64[iconKey], x: cx + off, y: cy + off, w: iw, h: iw });
  }

  // --- Titul slaydi ---
  const title = pres.addSlide();
  title.background = { color: NAVY };
  title.addShape(pres.ShapeType.ellipse, { x: 11.3, y: -1.6, w: 4.2, h: 4.2, fill: { color: '1E2C50' }, line: { type: 'none' } });
  title.addShape(pres.ShapeType.ellipse, { x: 12.15, y: 5.85, w: 2.4, h: 2.4, fill: { color: GOLD }, transparency: 82, line: { type: 'none' } });
  iconBadge(title, 0.7, 0.65, 0.95, GOLD, 'gradcap_FFFFFF');
  title.addText((fan || 'Fan').toUpperCase(), {
    x: 1.85, y: 0.65, w: 8, h: 0.95, fontFace: 'Calibri', fontSize: 13, bold: true, color: GOLD, charSpacing: 2, valign: 'middle', margin: 0,
  });
  title.addText(mavzu || 'Taqdimot', {
    x: 0.7, y: 2.55, w: 11.4, h: 1.9, fontFace: 'Georgia', fontSize: 38, bold: true, color: 'FFFFFF', align: 'left', valign: 'top', margin: 0, lineSpacingMultiple: 1.05,
  });
  title.addText(daraja || '', {
    x: 0.7, y: 4.55, w: 8, h: 0.5, fontFace: 'Calibri', fontSize: 15, italic: true, color: 'B9C4DC', margin: 0,
  });

  // --- Kontent slaydlari ---
  (slides || []).forEach((s, i) => {
    const slide = pres.addSlide();
    slide.background = { color: CREAM };
    const iconKey = accentIcons[i % accentIcons.length];

    slide.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 13.33, h: 1.3, fill: { color: NAVY }, line: { type: 'none' } });
    iconBadge(slide, 0.55, 0.28, 0.75, GOLD, iconKey);
    slide.addText(String(s.title || ''), {
      x: 1.55, y: 0, w: 10.4, h: 1.3, fontFace: 'Georgia', fontSize: 23, bold: true, color: 'FFFFFF', valign: 'middle', margin: 0,
    });
    slide.addText(String(i + 1).padStart(2, '0'), {
      x: 12.4, y: 0, w: 0.7, h: 1.3, fontFace: 'Calibri', fontSize: 15, color: '5F6E92', valign: 'middle', align: 'right', margin: 0,
    });

    const bulletItems = (s.bullets || []).map(b => ({
      text: String(b),
      options: { bullet: { characterCode: '25AA', indent: 22 }, color: DARK, fontSize: 17, breakLine: true, paraSpaceAfter: 18 },
    }));
    if (bulletItems.length) {
      slide.addShape(pres.ShapeType.roundRect, { x: 0.7, y: 1.75, w: 11.93, h: 5.25, rectRadius: 0.08, fill: { color: 'FFFFFF' }, line: { color: 'E5E0D4', width: 1 } });
      slide.addText(bulletItems, { x: 1.15, y: 2.05, w: 11.0, h: 4.7, fontFace: 'Calibri', valign: 'top', margin: 0 });
    }
    slide.addShape(pres.ShapeType.ellipse, { x: 12.55, y: 6.55, w: 1.3, h: 1.3, fill: { color: LIGHTGOLD }, transparency: 55, line: { type: 'none' } });
  });

  await pres.writeFile({ fileName: filename + '.pptx' });
}

const EXPORT_ICON_MAP = { material: 'book_FFFFFF', slayd: 'presentation_FFFFFF', mashq: 'pencil_FFFFFF', test: 'checksquare_FFFFFF' };

function buildExportHeader(type, fan, mavzu, daraja) {
  const icon = ICONS_B64[EXPORT_ICON_MAP[type]];
  return `
    <table style="width:100%;background:#16213E;border-radius:10px;margin-bottom:22px;border-collapse:collapse;" cellpadding="0" cellspacing="0">
      <tr>
        <td style="width:74px;padding:18px 0 18px 20px;vertical-align:middle;">
          <table style="background:#C9942A;border-radius:50%;width:46px;height:46px;" cellpadding="0" cellspacing="0"><tr>
            <td style="width:46px;height:46px;text-align:center;vertical-align:middle;"><img src="${icon}" width="24" height="24" style="display:inline-block;" /></td>
          </tr></table>
        </td>
        <td style="padding:16px 20px 16px 10px;vertical-align:middle;">
          <div style="color:#C9942A;font-size:10.5px;font-weight:700;letter-spacing:1.5px;font-family:Calibri,Arial,sans-serif;">${META[type].title.toUpperCase()}</div>
          <div style="color:#ffffff;font-size:19px;font-weight:700;font-family:Georgia,serif;margin:3px 0;">${mavzu || ''}</div>
          <div style="color:#aebdd6;font-size:11.5px;font-family:Calibri,Arial,sans-serif;">${fan || ''} &nbsp;•&nbsp; ${daraja || ''}</div>
        </td>
      </tr>
    </table>`;
}

async function exportWithHeader(el, type, exportFn, filename) {
  const fan = (document.getElementById('fan').value || '').trim();
  const mavzu = (document.getElementById('mavzu').value || META[type].title).trim();
  const daraja = document.getElementById('daraja').value;
  const original = el.innerHTML;
  el.innerHTML = buildExportHeader(type, fan, mavzu, daraja) + original;
  try {
    await exportFn(el, filename);
  } finally {
    el.innerHTML = original;
  }
}

async function handlePdfClick(type, btn) {
  const fullEl = document.querySelector(`[data-full="${type}"]`);
  const name = buildFilename(type);
  const old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin spin-dark"></span> Tayyorlanmoqda...';
  try {
    await exportWithHeader(fullEl, type, downloadAsPDF, name);
  } catch (e) {
    alert("PDF yaratishda xatolik yuz berdi. Qayta urinib ko'ring.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = old;
  }
}

function handleWordClick(type) {
  const fullEl = document.querySelector(`[data-full="${type}"]`);
  exportWithHeader(fullEl, type, (el, name) => downloadAsWord(el, name), buildFilename(type));
}

function showDownloadButtons(type) {
  const box = document.querySelector(`[data-actions="${type}"]`);
  box.style.display = 'block';
  const hasSlides = type === 'slayd' && Array.isArray(slidesData[type]) && slidesData[type].length > 0;
  box.innerHTML = `
    <div class="actions-row">
      <button class="btn-download" data-pdf="${type}">📄 PDF</button>
      <button class="btn-download" data-word="${type}">📝 Word</button>
      ${hasSlides ? `<button class="btn-download" data-pptx="${type}">🎨 PPTX</button>` : ''}
    </div>
  `;
  box.querySelector('[data-pdf]').addEventListener('click', (e) => handlePdfClick(type, e.currentTarget));
  box.querySelector('[data-word]').addEventListener('click', () => handleWordClick(type));
  if (hasSlides) {
    box.querySelector('[data-pptx]').addEventListener('click', (e) => handlePptxClick(type, e.currentTarget));
  }
}

async function handlePptxClick(type, btn) {
  const fan = (document.getElementById('fan').value || 'Fan').trim();
  const mavzu = (document.getElementById('mavzu').value || META[type].title).trim();
  const daraja = document.getElementById('daraja').value;
  const old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin spin-dark"></span> Tayyorlanmoqda...';
  try {
    await downloadAsPPTX(slidesData[type], fan, mavzu, daraja, buildFilename(type));
  } catch (e) {
    alert("PPTX yaratishda xatolik yuz berdi. Qayta urinib ko'ring.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = old;
  }
}

function showPayGate(type) {
  const box = document.querySelector(`[data-actions="${type}"]`);
  box.style.display = 'block';
  box.innerHTML = `
    <div class="pay-gate">
      <p class="pay-gate-text">✅ Materialingiz tayyor!<br>Yuklab olish uchun to'lov qiling — 4 990 so'm</p>
      <button class="btn-pay" data-pay="${type}">💳 Click orqali to'lash</button>
    </div>
  `;
  box.querySelector('[data-pay]').addEventListener('click', () => payWithClick(type));
}

function showChecking(type) {
  const box = document.querySelector(`[data-actions="${type}"]`);
  box.style.display = 'block';
  box.innerHTML = `<div class="pay-gate"><p class="pay-gate-text"><span class="spin spin-dark"></span> To'lov tekshirilmoqda...</p></div>`;
}

function payWithClick(type) {
  if (CLICK_SERVICE_ID === 'SIZNING_SERVICE_ID' || CLICK_MERCHANT_ID === 'SIZNING_MERCHANT_ID') {
    // Click hisobi hali ulanmagan — buzilgan sahifaga emas, tushunarli xabarga yo'naltiramiz.
    const box = document.querySelector(`[data-actions="${type}"]`);
    box.innerHTML = `<div class="pay-gate"><p class="pay-gate-text" style="color:#B23A3A;">To'lov tizimi hali sozlanmoqda. Iltimos, birozdan keyin qayta urinib ko'ring.</p></div>`;
    return;
  }
  const orderId = `otm_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  localStorage.setItem('pending_order', JSON.stringify({ orderId, type }));
  const returnUrl = `${window.location.origin}${window.location.pathname}?paid_order=${orderId}&paid_type=${type}`;
  const params = new URLSearchParams({
    service_id: CLICK_SERVICE_ID,
    merchant_id: CLICK_MERCHANT_ID,
    amount: '4990',
    transaction_param: orderId,
    return_url: returnUrl,
  });
  window.location.href = `https://my.click.uz/services/pay?${params.toString()}`;
}

async function checkPendingPayment() {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('paid_order');
  const type = params.get('paid_type');
  if (!orderId || !type || !META[type]) return;

  window.history.replaceState({}, '', window.location.pathname);
  showChecking(type);

  for (let i = 0; i < 12; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try {
      const res = await fetch(`/api/check-payment?order=${encodeURIComponent(orderId)}`);
      const data = await res.json();
      if (data.paid) {
        results[type] = true;
        showDownloadButtons(type);
        updateTotal();
        return;
      }
    } catch (e) { /* keyingi urinishda davom etamiz */ }
  }

  const box = document.querySelector(`[data-actions="${type}"]`);
  box.innerHTML = `<div class="pay-gate"><p class="pay-gate-text" style="color:#B23A3A;">To'lov hali tasdiqlanmadi.<br>Agar to'lov qilgan bo'lsangiz, sahifani birozdan keyin yangilang.</p></div>`;
}

function render() {
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '';
  Object.entries(META).forEach(([type, meta]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="item-card-head">
        <div class="item-left">
          <div class="icon-box" style="background:${meta.color}1A;">${meta.icon}</div>
          <div>
            <p class="item-title">${meta.title}</p>
            <p class="item-desc">${meta.desc}</p>
          </div>
        </div>
      </div>
      <div class="item-body">
        <button class="generate" data-type="${type}">✨ Yaratish</button>
        <div class="error-text" data-error="${type}" style="display:none;"></div>
        <div class="result-box" data-result="${type}" style="display:none;"></div>
        <p class="summary-hint" data-hint="${type}" style="display:none;">To'liq, batafsil va ilmiy asoslangan versiya PDF/Word formatida yuklab olinadi.</p>
        <div class="full-content" data-full="${type}"></div>
        <div class="actions-row" data-actions="${type}" style="display:none;"></div>
      </div>
    `;
    cardsEl.appendChild(card);
  });

  document.querySelectorAll('button.generate').forEach(btn => {
    btn.addEventListener('click', () => generate(btn.dataset.type));
  });
}

function buildFilename(type) {
  const fan = (document.getElementById('fan').value || 'Fan').trim();
  const mavzu = (document.getElementById('mavzu').value || META[type].title).trim();
  return `${fan}_${mavzu}_${META[type].title}`.replace(/\s+/g, '_');
}

async function generate(type) {
  const fan = document.getElementById('fan').value || 'Fan';
  const mavzu = document.getElementById('mavzu').value.trim();
  const daraja = document.getElementById('daraja').value;
  const errorEl = document.querySelector(`[data-error="${type}"]`);
  const resultEl = document.querySelector(`[data-result="${type}"]`);
  const btn = document.querySelector(`button[data-type="${type}"]`);

  if (!mavzu) {
    errorEl.textContent = "Avval mavzuni kiriting.";
    errorEl.style.display = 'block';
    return;
  }
  const useSearch = document.getElementById('useSearch').checked;

  errorEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = useSearch
    ? '<span class="spin"></span> Internetdan izlanmoqda...'
    : '<span class="spin"></span> Yaratilmoqda...';

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, fan, mavzu, daraja, useSearch }),
    });
    if (res.status === 429) {
      errorEl.textContent = "Juda ko'p so'rov yubordingiz. Birozdan keyin qayta urinib ko'ring.";
      errorEl.style.display = 'block';
      return;
    }
    if (!res.ok) throw new Error('Server xatosi');
    const data = await res.json();
    renderContent(resultEl, data.summary);
    resultEl.style.display = 'block';
    const fullEl = document.querySelector(`[data-full="${type}"]`);
    renderContent(fullEl, data.full);
    document.querySelector(`[data-hint="${type}"]`).style.display = 'block';
    if (data.slides) slidesData[type] = data.slides;
    if (data.isFree) {
      results[type] = true;
      showDownloadButtons(type);
      updateTotal();
    } else {
      showPayGate(type);
    }
  } catch (e) {
    errorEl.textContent = "Xatolik yuz berdi. Qayta urinib ko'ring.";
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✨ Yaratish';
  }
}

function updateTotal() {
  const count = Object.keys(results).length;
  const totalEl = document.getElementById('total');
  if (count > 0) {
    totalEl.style.display = 'block';
    totalEl.innerHTML = `To'langan materiallar: ${count} ta — jami: <strong style="color:#16213E;">${(count*4990).toLocaleString()} so'm</strong>`;
  } else {
    totalEl.style.display = 'none';
  }
}

// Fan/Mavzu/Daraja o'zgarsa, eski natija va "to'landi" belgisini tozalaymiz.
// Aks holda ikkita muammo bo'lardi: (1) eskirgan natija ekranda qolib,
// yangi mavzuga tegishlidek ko'rinadi; (2) bir marta to'lagandan keyin
// mavzuni almashtirib, yangi materialni bepul olish mumkin bo'lardi.
function resetAllCards() {
  Object.keys(META).forEach(type => {
    const resultEl = document.querySelector(`[data-result="${type}"]`);
    const actionsEl = document.querySelector(`[data-actions="${type}"]`);
    const errorEl = document.querySelector(`[data-error="${type}"]`);
    const hintEl = document.querySelector(`[data-hint="${type}"]`);
    const fullEl = document.querySelector(`[data-full="${type}"]`);
    if (resultEl) { resultEl.style.display = 'none'; resultEl.innerHTML = ''; }
    if (actionsEl) { actionsEl.style.display = 'none'; actionsEl.innerHTML = ''; }
    if (errorEl) { errorEl.style.display = 'none'; }
    if (hintEl) { hintEl.style.display = 'none'; }
    if (fullEl) { fullEl.innerHTML = ''; }
    delete results[type];
    delete slidesData[type];
  });
  updateTotal();
}

['fan', 'mavzu', 'daraja'].forEach(id => {
  document.getElementById(id).addEventListener('input', resetAllCards);
  document.getElementById(id).addEventListener('change', resetAllCards);
});

render();
checkPendingPayment();
</script>
